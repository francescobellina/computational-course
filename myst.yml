version: 1

project:
  title: Computational Material Science
  description: Notes, numerical experiments and simulations in statistical mechanics.
  github: francescobellina/computational-course
  license: MIT

  bibliography:
    - book/references.bib

  toc:
    - file: book/intro.md
    - file: book/mappa_concetti.md
    - title: "Parte I — Teoria"
      children:
        - file: book/teoria/01_meccanica_statistica.md
        - file: book/teoria/02_approssimazione_adiabatica.md
        - file: book/teoria/03_potenziali_e_cristalli.md
        - file: book/teoria/04_dinamica_molecolare.md
        - file: book/teoria/05_simulazioni_md.md
        - file: book/teoria/06_steepest_descent.md
    - title: "Parte II — Laboratori del corso"
      children:
        - file: book/laboratori/cms4_intro.md
          children:
            - file: notebooks/laboratori/cms4/coordinazione_e_lennard_jones.ipynb
            - file: notebooks/laboratori/cms4/forze_e_statica_molecolare.ipynb
        - file: notebooks/laboratori/cms5/equazioni_del_moto.ipynb
        - file: notebooks/laboratori/cms6/esercizi_cms6.ipynb
        - file: notebooks/laboratori/steepest_descent.ipynb
    - title: "Parte III — Esame"
      children:
        - title: "Esercizio 1 — MD di LJ-Ag (PART 1 + 2)"
          children:
            - file: book/esame/esercizio1/consegna.md
            - file: notebooks/esame/esercizio1_part1_2.ipynb
            - file: book/esame/esercizio1/note_tecniche.md
        - file: book/esame/orale_domande.md
    - title: "Appendici"
      children:
        - file: notebooks/appendici/efficienza_codice.ipynb
        - file: book/appendici/approfondimento_proteine_hpc4ai.md
        - file: book/appendici/workflow.md
        - file: book/appendici/archivio_esercizio1_5_punti.md
          children:
            - file: notebooks/archivio/esercizio1_soluzione.ipynb
            - file: notebooks/archivio/punti_1_2_passo_temporale.ipynb
  exclude:
    - README.md
    - tests/**
    - src/**
    - scripts/**
    - data/**
    - .github/**
    - docs/**
    - .vscode/**

site:
  template: book-theme
  title: Computational Material Science
  description: Notes, numerical experiments and simulations in CMS.

  options:
    logo: imm4book/logoo.png
    hide_toc: false
    hide_outline: false
    hide_footer_links: false
    hide_title_block: false
    hide_authors: true
    hide_search: false
    outline_maxdepth: 3
    numbered_references: true
    folders: true
    style: ./style.css
