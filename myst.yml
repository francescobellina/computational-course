version: 1

project:
  title: Computational Course
  description: Appunti, esperimenti numerici e codice riutilizzabile per un corso computazionale.
  github: francescobellina/computational-course
  license: MIT
  bibliography:
    - book/references.bib
  toc:
    - file: book/intro.md
    - title: Workflow del progetto
      children:
        - file: book/01_workflow.md
    - title: Metodi per equazioni non lineari
      children:
        - file: book/02_root_finding/newton.md
        - file: notebooks/02_root_finding/newton_experiment.ipynb
  exclude:
    - README.md
    - tests/**
    - src/**
    - scripts/**
    - data/**
    - .github/**
    - .vscode/**

site:
  template: book-theme
  title: Computational Course
  actions:
    - title: Repository GitHub
      url: https://github.com/francescobellina/computational-course
