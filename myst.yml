version: 1

project:
  title: Computational Material Science
  description: Notes, numerical experiments and simulations in statistical mechanics.
  github: francescobellina/computational-course
  license: MIT

  bibliography:
    - book/references.bib

  toc:
    - file: book/intro.md
    - pattern: book/**/*.md
    - pattern: notebooks/**/*.ipynb

  exclude:
    - README.md
    - tests/**
    - src/**
    - scripts/**
    - data/**
    - .github/**
    - .vscode/**

site:
  template: book-theme
  title: Computational Material Science
  description: Notes, numerical experiments and simulations in CMS.

  options:
    logo_text: CMS
    hide_toc: false
    hide_outline: false
    hide_footer_links: false
    hide_title_block: false
    hide_authors: true
    hide_search: false
    outline_maxdepth: 3
    numbered_references: true
    folders: true
    style: ./style.css

  actions:
    - title: Repository GitHub
      url: https://github.com/francescobellina/computational-course
