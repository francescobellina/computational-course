[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-course"
version = "0.1.0"
description = "Reusable numerical methods and computational course material."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "ovito==3.16.1.post1; sys_platform == 'darwin'",
    "ovito==3.16.1; sys_platform == 'linux'",
    "py3dmol>=2.5.5",
]

[dependency-groups]
dev = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "pandas==3.0.6",
  "sympy==1.14.0",
  "jupyter==1.1.1",
  "jupyter-book==2.1.7",
  "pytest==9.1.1",
  "ruff==0.16.8",
  "numba==0.68.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
# course file (poly7.py from the e-learning page), kept exactly as provided
"src/computational_course/poly7.py" = ["ALL"]

[tool.ruff.format]
# same file: `ruff format` must not rewrite it either
exclude = ["src/computational_course/poly7.py"]
